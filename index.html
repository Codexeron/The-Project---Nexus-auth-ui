<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS AUTH — Futuristic Authentication UI</title>

    <meta
        name="description"
        content="Futuristic login and registration interface with neon glassmorphism effects."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyan: #00d9ff;
            --blue: #168cff;
            --purple: #a855ff;
            --pink: #e24cff;
            --bg: #030712;
            --panel: rgba(8, 15, 32, 0.78);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f4f7ff;
            --muted: #8792ab;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);
            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(0, 217, 255, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 30%,
                    rgba(168, 85, 255, 0.14),
                    transparent 35%
                ),
                #030712;

            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            overflow: hidden;
        }

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(0, 217, 255, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 217, 255, 0.035) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            transform: perspective(500px) rotateX(55deg) scale(1.5);
            transform-origin: center bottom;

            opacity: 0.45;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: floatOrb 12s ease-in-out infinite;
        }

        .orb.one {
            width: 300px;
            height: 300px;
            left: -100px;
            top: 15%;
            background: rgba(0, 217, 255, 0.18);
        }

        .orb.two {
            width: 350px;
            height: 350px;
            right: -120px;
            top: 25%;
            background: rgba(168, 85, 255, 0.18);
            animation-delay: -5s;
        }

        .orb.three {
            width: 200px;
            height: 200px;
            left: 45%;
            bottom: -100px;
            background: rgba(226, 76, 255, 0.12);
            animation-delay: -8s;
        }

        @keyframes floatOrb {
            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(40px, -30px);
            }
        }

        /* =========================
           APP
        ========================= */

        .app {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-container {
            width: min(1100px, 100%);
            min-height: 650px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            position: relative;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;

            background: rgba(3, 7, 18, 0.55);
            backdrop-filter: blur(25px);

            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            overflow: hidden;
        }

        /* =========================
           PANELS
        ========================= */

        .panel {
            position: relative;
            padding: 55px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            transition:
                transform 0.8s cubic-bezier(.2,.8,.2,1),
                opacity 0.8s ease;
        }

        .login-panel {
            border-right: 1px solid rgba(0, 217, 255, 0.08);
        }

        .register-panel {
            border-left: 1px solid rgba(168, 85, 255, 0.08);
        }

        .panel::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 217, 255, 0.04),
                    transparent 45%
                );
        }

        .register-panel::before {
            background:
                linear-gradient(
                    135deg,
                    rgba(168, 85, 255, 0.05),
                    transparent 45%
                );
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 70px;
            height: 70px;

            display: grid;
            place-items: center;

            margin: 0 auto 24px;

            position: relative;

            border: 1px solid rgba(0, 217, 255, 0.7);

            clip-path: polygon(
                25% 5%,
                75% 5%,
                95% 25%,
                95% 75%,
                75% 95%,
                25% 95%,
                5% 75%,
                5% 25%
            );

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 217, 255, 0.15),
                    rgba(168, 85, 255, 0.15)
                );

            box-shadow:
                0 0 20px rgba(0, 217, 255, 0.25),
                inset 0 0 20px rgba(168, 85, 255, 0.12);

            animation: logoPulse 3s ease-in-out infinite;
        }

        .register-panel .logo {
            border-color: rgba(226, 76, 255, 0.8);

            box-shadow:
                0 0 25px rgba(226, 76, 255, 0.25),
                inset 0 0 20px rgba(168, 85, 255, 0.15);
        }

        .logo::after {
            content: "N";

            font-size: 28px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    var(--cyan),
                    var(--purple)
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        /* =========================
           TITLES
        ========================= */

        .title {
            text-align: center;

            font-size: clamp(30px, 4vw, 42px);
            font-weight: 800;

            letter-spacing: 4px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: var(--muted);

            font-size: 14px;

            margin-bottom: 34px;
        }

        /* =========================
           FORM
        ========================= */

        .form {
            position: relative;
            z-index: 2;
        }

        .field {
            position: relative;
            margin-bottom: 18px;
        }

        .field input {
            width: 100%;

            height: 54px;

            padding: 0 48px 0 18px;

            color: white;

            font-size: 14px;

            border-radius: 10px;

            outline: none;

            border: 1px solid rgba(255, 255, 255, 0.12);

            background:
                rgba(5, 12, 27, 0.72);

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }

        .field input::placeholder {
            color: #65708a;
        }

        .field input:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .field input:focus {
            transform: translateY(-1px);

            border-color: var(--cyan);

            box-shadow:
                0 0 0 3px rgba(0, 217, 255, 0.06),
                0 0 25px rgba(0, 217, 255, 0.13);
        }

        .register-panel .field input:focus {
            border-color: var(--purple);

            box-shadow:
                0 0 0 3px rgba(168, 85, 255, 0.06),
                0 0 25px rgba(168, 85, 255, 0.13);
        }

        .field-icon {
            position: absolute;

            right: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--cyan);

            pointer-events: none;
        }

        .register-panel .field-icon {
            color: var(--purple);
        }

        .password-toggle {
            position: absolute;

            right: 16px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: none;

            color: #6e7890;

            cursor: pointer;

            font-size: 14px;

            transition: 0.3s;
        }

        .password-toggle:hover {
            color: white;
        }

        /* =========================
           OPTIONS
        ========================= */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 8px 0 25px;

            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #8994ab;

            cursor: pointer;
        }

        .remember input {
            accent-color: var(--cyan);
        }

        .forgot {
            color: var(--cyan);
            text-decoration: none;

            transition: 0.3s;
        }

        .forgot:hover {
            text-shadow:
                0 0 10px var(--cyan);
        }

        /* =========================
           NEON BUTTON
        ========================= */

        .neon-button {
            width: 100%;
            height: 58px;

            position: relative;

            border: 1px solid var(--cyan);

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 217, 255, 0.08),
                    rgba(168, 85, 255, 0.12)
                );

            color: white;

            font-weight: 800;

            letter-spacing: 3px;

            cursor: pointer;

            overflow: hidden;

            clip-path: polygon(
                0 10px,
                10px 0,
                calc(100% - 10px) 0,
                100% 10px,
                100% calc(100% - 10px),
                calc(100% - 10px) 100%,
                10px 100%,
                0 calc(100% - 10px)
            );

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }

        .register-panel .neon-button {
            border-color: var(--purple);
        }

        .neon-button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            transform: skewX(-25deg);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.45),
                    transparent
                );

            transition: left 0.7s ease;
        }

        .neon-button:hover::before {
            left: 140%;
        }

        .neon-button:hover {
            transform: translateY(-3px) scale(1.01);

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 217, 255, 0.18),
                    rgba(168, 85, 255, 0.22)
                );

            box-shadow:
                0 0 20px rgba(0, 217, 255, 0.25),
                0 0 50px rgba(168, 85, 255, 0.15);
        }

        .register-panel .neon-button:hover {
            box-shadow:
                0 0 20px rgba(168, 85, 255, 0.3),
                0 0 50px rgba(226, 76, 255, 0.15);
        }

        .neon-button:active {
            transform: scale(0.98);
        }

        .button-arrow {
            margin-left: 12px;

            font-size: 18px;

            transition: transform 0.3s ease;
        }

        .neon-button:hover .button-arrow {
            transform: translateX(7px);
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 28px 0 20px;

            color: #5f6b83;

            font-size: 11px;

            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.12),
                    transparent
                );
        }

        /* =========================
           SOCIAL
        ========================= */

        .socials {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .social {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border: 1px solid rgba(255, 255, 255, 0.12);

            background:
                rgba(255, 255, 255, 0.025);

            border-radius: 10px;

            color: #ccd3e3;

            font-weight: 700;

            cursor: pointer;

            transition:
                0.3s ease;
        }

        .social:hover {
            transform:
                translateY(-4px)
                rotate(2deg);

            border-color: var(--cyan);

            color: var(--cyan);

            box-shadow:
                0 0 20px rgba(0, 217, 255, 0.12);
        }

        .register-panel .social:hover {
            border-color: var(--purple);
            color: var(--purple);
        }

        /* =========================
           SWITCH
        ========================= */

        .switch-text {
            text-align: center;

            margin-top: 25px;

            color: #727e95;

            font-size: 12px;
        }

        .switch {
            border: none;
            background: none;

            color: var(--cyan);

            font-weight: 700;

            cursor: pointer;

            margin-left: 5px;

            transition: 0.3s;
        }

        .switch:hover {
            text-shadow:
                0 0 12px var(--cyan);
        }

        .register-panel .switch {
            color: var(--purple);
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            position: fixed;

            right: 25px;
            bottom: 25px;

            min-width: 260px;

            padding: 16px 18px;

            border-radius: 12px;

            border: 1px solid rgba(0, 217, 255, 0.25);

            background:
                rgba(5, 12, 27, 0.9);

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45);

            transform:
                translateY(150px);

            opacity: 0;

            transition: 0.4s ease;

            z-index: 100;
        }

        .status.show {
            transform: translateY(0);
            opacity: 1;
        }

        .status.success {
            border-color: rgba(0, 255, 170, 0.35);
        }

        .status.error {
            border-color: rgba(255, 75, 100, 0.4);
        }

        .status-title {
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .status-message {
            color: #8d98af;
            font-size: 12px;
        }

        /* =========================
           LOADING
        ========================= */

        .loader {
            display: inline-block;

            width: 16px;
            height: 16px;

            border-radius: 50%;

            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;

            animation: spin 0.7s linear infinite;

            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {
            .auth-container {
                grid-template-columns: 1fr;
                max-width: 560px;
            }

            .login-panel {
                border-right: none;
            }

            .register-panel {
                display: none;
                border-left: none;
            }

            .auth-container.register-mode .login-panel {
                display: none;
            }

            .auth-container.register-mode .register-panel {
                display: flex;
            }

            .panel {
                padding: 40px 28px;
            }
        }

        @media (min-width: 851px) {
            .switch {
                display: none;
            }
        }

        @media (max-width: 500px) {
            .app {
                padding: 15px;
            }

            .auth-container {
                border-radius: 20px;
            }

            .panel {
                padding: 32px 20px;
            }

            .title {
                font-size: 28px;
                letter-spacing: 3px;
            }

            .status {
                right: 15px;
                left: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>


<main class="app">

    <section class="auth-container" id="authContainer">

        <!-- ================= LOGIN ================= -->

        <div class="panel login-panel">

            <div class="logo"></div>

            <h1 class="title">
                WELCOME BACK
            </h1>

            <p class="subtitle">
                Login to your account
            </p>


            <form
                class="form"
                id="loginForm"
                autocomplete="on"
            >

                <div class="field">

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                    <span class="field-icon">
                        ✉
                    </span>

                </div>


                <div class="field">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="loginPassword"
                        aria-label="Show password"
                    >
                        ◉
                    </button>

                </div>


                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>


                    <a
                        href="#"
                        class="forgot"
                        id="forgotPassword"
                    >
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="neon-button"
                    id="loginButton"
                >

                    SIGN IN

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>


            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>


            <div class="socials">

                <button class="social">
                    G
                </button>

                <button class="social">
                    GH
                </button>

                <button class="social">
                    D
                </button>

            </div>


            <p class="switch-text">

                Don't have an account?

                <button
                    class="switch"
                    id="showRegister"
                >
                    Sign up
                </button>

            </p>

        </div>


        <!-- ================= REGISTER ================= -->

        <div class="panel register-panel">

            <div class="logo"></div>

            <h1 class="title">
                CREATE ACCOUNT
            </h1>

            <p class="subtitle">
                Join us and explore the future
            </p>


            <form
                class="form"
                id="registerForm"
                autocomplete="on"
            >

                <div class="field">

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Full Name"
                        autocomplete="name"
                        required
                    >

                    <span class="field-icon">
                        ♙
                    </span>

                </div>


                <div class="field">

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                    <span class="field-icon">
                        ✉
                    </span>

                </div>


                <div class="field">

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Username"
                        autocomplete="username"
                        minlength="3"
                        required
                    >

                    <span class="field-icon">
                        @
                    </span>

                </div>


                <div class="field">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="registerPassword"
                    >
                        ◉
                    </button>

                </div>


                <div class="field">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                    >
                        ◉
                    </button>

                </div>


                <button
                    type="submit"
                    class="neon-button"
                    id="registerButton"
                >

                    SIGN UP

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>


            <p class="switch-text">

                Already have an account?

                <button
                    class="switch"
                    id="showLogin"
                >
                    Sign in
                </button>

            </p>

        </div>

    </section>

</main>


<!-- ================= STATUS ================= -->

<div
    class="status"
    id="status"
>
    <div
        class="status-title"
        id="statusTitle"
    >
        Status
    </div>

    <div
        class="status-message"
        id="statusMessage"
    >
        Message
    </div>
</div>


<script>

    /* =========================================
       ELEMENTS
    ========================================= */

    const authContainer =
        document.getElementById("authContainer");

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const showRegister =
        document.getElementById("showRegister");

    const showLogin =
        document.getElementById("showLogin");

    const status =
        document.getElementById("status");

    const statusTitle =
        document.getElementById("statusTitle");

    const statusMessage =
        document.getElementById("statusMessage");


    /* =========================================
       LOGIN / REGISTER SWITCH
    ========================================= */

    showRegister.addEventListener("click", () => {

        authContainer.classList.add("register-mode");

        if (window.innerWidth > 850) {

            document
                .querySelector(".login-panel")
                .animate(
                    [
                        {
                            opacity: 1,
                            transform: "translateX(0)"
                        },
                        {
                            opacity: 0,
                            transform: "translateX(-25px)"
                        },
                        {
                            opacity: 1,
                            transform: "translateX(0)"
                        }
                    ],
                    {
                        duration: 600,
                        easing: "ease"
                    }
                );

            document
                .querySelector(".register-panel")
                .animate(
                    [
                        {
                            opacity: 0,
                            transform: "translateX(25px)"
                        },
                        {
                            opacity: 1,
                            transform: "translateX(0)"
                        }
                    ],
                    {
                        duration: 600,
                        easing: "ease"
                    }
                );
        }

    });


    showLogin.addEventListener("click", () => {

        authContainer.classList.remove("register-mode");

    });


    /* =========================================
       PASSWORD VISIBILITY
    ========================================= */

    document
        .querySelectorAll(".password-toggle")
        .forEach(button => {

            button.addEventListener("click", () => {

                const targetId =
                    button.dataset.target;

                const input =
                    document.getElementById(targetId);

                if (input.type === "password") {

                    input.type = "text";

                    button.textContent = "◌";

                } else {

                    input.type = "password";

                    button.textContent = "◉";

                }

            });

        });


    /* =========================================
       STATUS MESSAGE
    ========================================= */

    function showStatus(
        title,
        message,
        type = "success"
    ) {

        statusTitle.textContent = title;
        statusMessage.textContent = message;

        status.className =
            `status show ${type}`;

        setTimeout(() => {

            status.classList.remove("show");

        }, 4000);

    }


    /* =========================================
       PASSWORD HASH
       DEMO ONLY
    ========================================= */

    async function hashPassword(password) {

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(password);

        const hash =
            await crypto.subtle.digest(
                "SHA-256",
                data
            );

        return Array
            .from(new Uint8Array(hash))
            .map(
                byte =>
                    byte
                        .toString(16)
                        .padStart(2, "0")
            )
            .join("");

    }


    /* =========================================
       DATABASE SIMULATION
    ========================================= */

    function getUsers() {

        return JSON.parse(
            localStorage.getItem("nexus_users")
            || "[]"
        );

    }


    function saveUsers(users) {

        localStorage.setItem(
            "nexus_users",
            JSON.stringify(users)
        );

    }


    /* =========================================
       REGISTER
    ========================================= */

    registerForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const name =
                document
                    .getElementById("registerName")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("registerEmail")
                    .value
                    .trim()
                    .toLowerCase();

            const username =
                document
                    .getElementById("registerUsername")
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                document
                    .getElementById("registerPassword")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (password.length < 8) {

                showStatus(
                    "WEAK PASSWORD",
                    "Password must contain at least 8 characters.",
                    "error"
                );

                return;
            }


            if (password !== confirmPassword) {

                showStatus(
                    "PASSWORD ERROR",
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            const users =
                getUsers();


            const exists =
                users.some(
                    user =>
                        user.email === email ||
                        user.username === username
                );


            if (exists) {

                showStatus(
                    "ACCOUNT EXISTS",
                    "Email or username is already registered.",
                    "error"
                );

                return;
            }


            const button =
                document.getElementById("registerButton");

            const original =
                button.innerHTML;

            button.innerHTML =
                `<span class="loader"></span>CREATING...`;

            button.disabled = true;


            const passwordHash =
                await hashPassword(password);


            await new Promise(
                resolve =>
                    setTimeout(resolve, 900)
            );


            const user = {

                id:
                    crypto.randomUUID(),

                name,

                email,

                username,

                passwordHash,

                createdAt:
                    new Date().toISOString()

            };


            users.push(user);

            saveUsers(users);


            button.innerHTML =
                original;

            button.disabled = false;


            registerForm.reset();


            showStatus(
                "ACCOUNT CREATED",
                `Welcome ${name}. Your account has been created.`,
                "success"
            );


            setTimeout(() => {

                authContainer.classList.remove(
                    "register-mode"
                );

                document
                    .getElementById("loginEmail")
                    .value = email;

            }, 1200);

        }
    );


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const button =
                document.getElementById(
                    "loginButton"
                );

            const original =
                button.innerHTML;

            button.innerHTML =
                `<span class="loader"></span>AUTHENTICATING...`;

            button.disabled = true;


            const passwordHash =
                await hashPassword(password);


            await new Promise(
                resolve =>
                    setTimeout(resolve, 800)
            );


            const users =
                getUsers();


            const user =
                users.find(
                    item =>
                        item.email === email &&
                        item.passwordHash === passwordHash
                );


            button.innerHTML =
                original;

            button.disabled = false;


            if (!user) {

                showStatus(
                    "ACCESS DENIED",
                    "Invalid email or password.",
                    "error"
                );

                return;
            }


            localStorage.setItem(
                "nexus_session",
                JSON.stringify({
                    userId: user.id,
                    email: user.email,
                    username: user.username,
                    loginAt:
                        new Date().toISOString()
                })
            );


            showStatus(
                "ACCESS GRANTED",
                `Welcome back, ${user.name}.`,
                "success"
            );


            loginForm.reset();

        }
    );


    /* =========================================
       FORGOT PASSWORD DEMO
    ========================================= */

    document
        .getElementById("forgotPassword")
        .addEventListener(
            "click",
            event => {

                event.preventDefault();

                showStatus(
                    "PASSWORD RECOVERY",
                    "Connect this action to your backend email service.",
                    "success"
                );

            }
        );


    /* =========================================
       SOCIAL BUTTON DEMO
    ========================================= */

    document
        .querySelectorAll(".social")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    showStatus(
                        "OAUTH",
                        "OAuth provider integration is ready to be connected.",
                        "success"
                    );

                }
            );

        });


    /* =========================================
       CURSOR GLOW
    ========================================= */

    document.addEventListener(
        "mousemove",
        event => {

            const x =
                event.clientX /
                window.innerWidth *
                100;

            const y =
                event.clientY /
                window.innerHeight *
                100;

            document.body.style.background =
                `
                radial-gradient(
                    circle at ${x}% ${y}%,
                    rgba(0,217,255,0.045),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 30%,
                    rgba(168,85,255,0.10),
                    transparent 35%
                ),
                #030712
                `;

        }
    );

</script>

</body>
</html>
